version: "3.8"

services:
  # 1. FastAPI Model Serving Backend
  fastapi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-fastapi-backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/model.joblib
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
      - ./model.joblib:/app/model.joblib
    restart: unless-stopped
    networks:
      - ml-network

  # 2. Streamlit Interactive Web Frontend
  streamlit-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ml-streamlit-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://fastapi-backend:8000
    depends_on:
      - fastapi-backend
    restart: unless-stopped
    networks:
      - ml-network

  # 3. MLflow Tracking & Model Registry Web UI
  mlflow-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-mlflow-ui
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
    command: mlflow ui --backend-store-uri sqlite:////app/mlflow.db --default-artifact-root /app/mlruns --host 0.0.0.0 --port 5000
    restart: unless-stopped
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge